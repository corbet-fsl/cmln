schema = 1
project = "cmln"

# Select affected checks explicitly; no implicit full language/platform matrix.
[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]

[render]
render_schema = 2

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["rust"]
workflow = "ci"
command = ["bash", ".ci/run-job.sh"]
